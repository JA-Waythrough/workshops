<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AI and Waythrough: Questions — Strategic Brainstorm</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/presentation.css">

  <style>
    /* Section 7.3 Organic Pebble Photo Masks */
    .wt-pebble-mask-1 {
      border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      border: 3px solid rgba(255,255,255,0.85);
      animation: pebbleMorph1 14s ease-in-out infinite alternate;
    }

    .wt-pebble-mask-2 {
      border-radius: 45% 55% 60% 40% / 55% 45% 55% 45%;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      border: 3px solid rgba(255,255,255,0.85);
      animation: pebbleMorph2 14s ease-in-out infinite alternate;
    }

    .wt-pebble-mask-3 {
      border-radius: 52% 48% 62% 38% / 42% 58% 42% 58%;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      border: 3px solid rgba(255,255,255,0.85);
      animation: pebbleMorph3 16s ease-in-out infinite alternate;
    }

    .photo-fill {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .callout-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: 'Poppins', sans-serif;
    }

    /* ==========================================================================
       Waythrough Zero-Friction Password Gate Overlay
       ========================================================================== */
    .wt-auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 50% 38%, #182920 0%, #0d1310 72%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s;
    }

    .wt-auth-overlay.unlocked {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .wt-auth-ambient-pebble {
      position: absolute;
      width: 520px;
      height: 480px;
      background: radial-gradient(circle, rgba(66, 125, 95, 0.16) 0%, rgba(18, 83, 50, 0) 70%);
      border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%;
      pointer-events: none;
      animation: pebbleMorph1 12s ease-in-out infinite alternate;
    }

    .wt-auth-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: rgba(20, 29, 24, 0.92);
      border: 1px solid rgba(216, 243, 230, 0.14);
      border-radius: 24px;
      padding: 2.5rem 2.25rem 2.25rem;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      backdrop-filter: blur(16px);
      color: var(--wt-off-white);
      text-align: center;
      transform: translateY(0);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .wt-auth-card.shake {
      animation: wtAuthShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: rgba(255, 205, 202, 0.55);
    }

    @keyframes wtAuthShake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .wt-auth-lock-pebble {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, rgba(216, 243, 230, 0.16), rgba(66, 125, 95, 0.28));
      border: 1.5px solid rgba(216, 243, 230, 0.28);
      border-radius: 58% 42% 52% 48% / 46% 54% 46% 54%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--wt-green-mint);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .wt-auth-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: 'Roboto Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--wt-green-mint);
      background: rgba(66, 125, 95, 0.2);
      border: 1px solid rgba(216, 243, 230, 0.18);
      padding: 0.28rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 0.9rem;
    }

    .wt-auth-eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--wt-green-mint);
      box-shadow: 0 0 8px var(--wt-green-mint);
    }

    .wt-auth-title {
      font-size: 1.65rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 0.45rem;
    }

    .wt-auth-subtitle {
      font-size: 0.88rem;
      color: rgba(251, 251, 250, 0.68);
      line-height: 1.5;
      margin-bottom: 1.65rem;
    }

    .wt-auth-form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .wt-auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .wt-auth-input {
      width: 100%;
      padding: 0.9rem 2.8rem 0.9rem 1.1rem;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      color: #ffffff;
      background: rgba(13, 19, 16, 0.85);
      border: 1.5px solid rgba(216, 243, 230, 0.2);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      user-select: text;
    }

    .wt-auth-input::placeholder {
      color: rgba(251, 251, 250, 0.35);
    }

    .wt-auth-input:focus {
      border-color: var(--wt-green-mint);
      box-shadow: 0 0 0 3px rgba(216, 243, 230, 0.14);
    }

    .wt-auth-toggle-vis {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: rgba(251, 251, 250, 0.45);
      cursor: pointer;
      padding: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .wt-auth-toggle-vis:hover {
      color: var(--wt-green-mint);
      background: rgba(255, 255, 255, 0.06);
    }

    .wt-auth-submit {
      width: 100%;
      padding: 0.92rem 1.25rem;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--wt-green-dark);
      background: var(--wt-green-mint);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 20px rgba(18, 83, 50, 0.35);
    }

    .wt-auth-submit:hover {
      background: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(18, 83, 50, 0.45);
    }

    .wt-auth-submit:active {
      transform: translateY(0);
    }

    .wt-auth-submit:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .wt-auth-error {
      min-height: 1.25rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--wt-rose);
      margin-top: 0.25rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .wt-auth-error.visible {
      opacity: 1;
    }

    .wt-auth-footer-note {
      margin-top: 1.35rem;
      padding-top: 1.1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 0.74rem;
      color: rgba(251, 251, 250, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
  </style>
</head>

  <!-- Password Gate Overlay -->
  <div class="wt-auth-overlay" id="wtAuthOverlay">
    <div class="wt-auth-ambient-pebble"></div>
    <div class="wt-auth-card" id="wtAuthCard">
      <div class="wt-auth-lock-pebble" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="wt-auth-eyebrow">
        <span class="wt-auth-eyebrow-dot"></span>
        <span>WAYTHROUGH // PROTECTED DECK</span>
      </div>
      <h1 class="wt-auth-title">AI &amp; Waythrough</h1>
      <p class="wt-auth-subtitle">Navigating technology with human dignity, caution, and purpose. Enter the colleague passcode to view.</p>

      <form class="wt-auth-form" id="wtAuthForm" autocomplete="off">
        <div class="wt-auth-input-wrap">
          <input
            type="password"
            id="wtAuthInput"
            class="wt-auth-input"
            placeholder="Enter passcode..."
            aria-label="Presentation passcode"
            required
            autofocus

          <button type="button" class="wt-auth-toggle-vis" id="wtAuthToggleVis" title="Show/hide passcode" aria-label="Toggle passcode visibility">
            <svg id="wtEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button type="submit" class="wt-auth-submit" id="wtAuthSubmit">
          <span id="wtAuthSubmitText">Unlock Presentation</span>
          <span aria-hidden="true">➔</span>
        </button>
      </form>

      <div class="wt-auth-error" id="wtAuthError" role="alert"></div>

      <div class="wt-auth-footer-note">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>AES-256-GCM Client-Side Encrypted</span>
      </div>
    </div>
  </div>

  <!-- Web Crypto AES-256-GCM Unlock Controller -->
  <script>
    (function() {
      'use strict';

      const STORAGE_KEY = 'wt_presentation_passcode_v1';
      const overlay = document.getElementById('wtAuthOverlay');
      const card = document.getElementById('wtAuthCard');
      const form = document.getElementById('wtAuthForm');
      const input = document.getElementById('wtAuthInput');
      const submitBtn = document.getElementById('wtAuthSubmit');
      const submitText = document.getElementById('wtAuthSubmitText');
      const errorEl = document.getElementById('wtAuthError');
      const toggleVisBtn = document.getElementById('wtAuthToggleVis');
      const mountEl = document.getElementById('wtPresentationMount');
      const payloadEl = document.getElementById('wtEncryptedPayload');

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) {
          bytes[i] = bin.charCodeAt(i);
        }
        return bytes;
      }

      async function decryptPresentation(passcode) {
        const payload = JSON.parse(payloadEl.textContent);
        const salt = b64ToBytes(payload.salt);
        const iv = b64ToBytes(payload.iv);
        const ct = b64ToBytes(payload.ct);
        const iterations = payload.iter || 100000;

        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          'raw',
          enc.encode(passcode),
          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );

        const key = await window.crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: iterations,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decryptedBuffer = await window.crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          ct
        );

        return new TextDecoder().decode(decryptedBuffer);
      }

      async function tryUnlock(passcode, isAuto = false) {
        if (!passcode) return false;
        errorEl.classList.remove('visible');
        card.classList.remove('shake');
        submitBtn.disabled = true;
        submitText.textContent = 'Unlocking...';

        try {
          const html = await decryptPresentation(passcode.trim());
          mountEl.innerHTML = html;

          try {
            sessionStorage.setItem(STORAGE_KEY, passcode.trim());
          } catch (e) {}

          overlay.classList.add('unlocked');
          setTimeout(() => {
            overlay.style.display = 'none';
          }, 460);

          if (typeof window.initWaythroughPresentation === 'function') {
            window.initWaythroughPresentation();
          }
          return true;
        } catch (err) {
          submitBtn.disabled = false;
          submitText.textContent = 'Unlock Presentation';
          if (!isAuto) {
            errorEl.textContent = 'Incorrect passcode. Please try again.';
            errorEl.classList.add('visible');
            void card.offsetWidth;
            card.classList.add('shake');
            input.select();
          } else {
            try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
          }
          return false;
        }
      }

      // Show / hide password toggle
      if (toggleVisBtn && input) {
        toggleVisBtn.addEventListener('click', () => {
          const isPwd = input.type === 'password';
          input.type = isPwd ? 'text' : 'password';
          input.focus();
        });
      }

      // Form submit handler
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          await tryUnlock(input.value, false);
        });
      }

      // Auto-unlock from URL hash (#passcode) or sessionStorage
      window.addEventListener('DOMContentLoaded', async () => {
        const hashVal = window.location.hash ? decodeURIComponent(window.location.hash.slice(1)).trim() : '';
        if (hashVal) {
          const ok = await tryUnlock(hashVal, true);
          if (ok && window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
            return;
          }
        }

        try {
          const cached = sessionStorage.getItem(STORAGE_KEY);
          if (cached) {
            const ok = await tryUnlock(cached, true);
            if (ok) return;
          }
        } catch (e) {}

        if (input) input.focus();
      });
    })();
  </script>
